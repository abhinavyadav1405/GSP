name: Build GSP
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/gsp-reels-moderation"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check functions/index.js
      - run: node --check functions/scripts/migrate-legacy-credentials.js
      - run: node --check functions/scripts/set-admin-claim.js
      - run: node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
